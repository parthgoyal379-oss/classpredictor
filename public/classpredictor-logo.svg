<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="panelBg" x1="0" y1="0" x2="800" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08080A" />
      <stop offset="50%" stop-color="#030304" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Chrome / Titanium Gradients -->
    <linearGradient id="titaniumLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="titaniumDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Neon Prismatic Accents -->
    <linearGradient id="cyanFlare" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="accentGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Subtle Radial Glow Filters -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleReflection" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#38BDF8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Dark Canvas Base with 1px Precision Border -->
  <rect x="2" y="2" width="796" height="236" rx="20" fill="url(#panelBg)" stroke="#1F242E" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glow Behind the Mark -->
  <circle cx="125" cy="120" r="70" fill="#38BDF8" opacity="0.08" filter="url(#coreGlow)" />
  <circle cx="155" cy="120" r="60" fill="#A855F7" opacity="0.06" filter="url(#coreGlow)" />

  <!-- Mark Container Squircle (App Icon Badge) -->
  <g transform="translate(45, 40)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="160" height="160" rx="36" fill="#0A0D14" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
    
    <!-- Micro-grid overlay inside squircle -->
    <line x1="20" y1="80" x2="140" y2="80" stroke="rgba(255,255,255,0.03)" stroke-dasharray="3 3" />
    <line x1="80" y1="20" x2="80" y2="140" stroke="rgba(255,255,255,0.03)" stroke-dasharray="3 3" />

    <!-- Corner chamfer accents -->
    <path d="M12 28 C 12 19.163, 19.163 12, 28 12" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M148 132 C 148 140.837, 140.837 148, 132 148" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- ─── THE GLYPH: PRECISION TITANIUM C + P VECTOR ─── -->
    <g transform="translate(18, 18)" filter="url(#subtleReflection)">
      
      <!-- C-FACET 1: Top horizontal arm -->
      <polygon points="26,36 82,36 74,48 38,48 38,58 26,46" fill="url(#titaniumLight)" />
      
      <!-- C-FACET 2: Outer vertical spine with beveled cut -->
      <polygon points="26,46 38,58 38,82 26,94" fill="url(#titaniumDark)" />
      
      <!-- C-FACET 3: Bottom horizontal arm -->
      <polygon points="26,94 38,82 74,82 82,94 26,94" fill="url(#titaniumLight)" opacity="0.9" />

      <!-- C Laser Chamfer Line (Cyan Luminescence) -->
      <polyline points="80,36 26,36 26,94 80,94" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />

      <!-- P & PREDICTIVE VECTOR: Ascending Diamond Prism Core -->
      <!-- Center forward blade (The Prediction Surge) -->
      <polygon points="68,26 94,62 82,62 60,34" fill="url(#accentGlowGrad)" opacity="0.95" />
      <polygon points="94,62 68,98 60,90 82,62" fill="url(#titaniumDark)" />
      
      <!-- P Loop (Upper Right faceted head) -->
      <polygon points="86,40 108,40 118,52 108,64 86,64 92,52" fill="url(#titaniumLight)" />
      <polygon points="98,46 106,46 112,52 106,58 98,58" fill="#0A0D14" />

      <!-- P Stem (Faceted lower vertical pillar) -->
      <polygon points="86,64 98,64 98,96 86,96" fill="url(#titaniumDark)" />
      <polygon points="86,64 92,64 92,96 86,96" fill="url(#titaniumLight)" opacity="0.4" />

      <!-- Laser Spine Accent on P (Electric Violet/Cyan) -->
      <path d="M86,40 L108,40 L118,52 L108,64 L86,64 L86,96" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
      
      <!-- Prerequisite Vector Flare Ray -->
      <line x1="68" y1="26" x2="94" y2="62" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.95" />
      <circle cx="68" cy="26" r="2.5" fill="#38BDF8" />
      <circle cx="118" cy="52" r="2" fill="#C084FC" />
      <circle cx="68" cy="98" r="2" fill="#38BDF8" />
    </g>
  </g>

  <!-- ─── TYPOGRAPHY SECTION ─── -->
  <g transform="translate(235, 75)">
    <!-- Primary Brand Name "ClassPredictor" -->
    <text x="0" y="48" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.035em" fill="#FFFFFF">
      Class<tspan fill="url(#titaniumLight)">Predictor</tspan>
    </text>

    <!-- Version / Status Pill -->
    <g transform="translate(345, 18)">
      <rect x="0" y="0" width="58" height="22" rx="6" fill="#121620" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <circle cx="10" cy="11" r="3" fill="#38BDF8" />
      <text x="20" y="15" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.05em">PRO</text>
    </g>

    <!-- Subtitle / Meta Tagline -->
    <text x="2" y="82" font-family="'Geist', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748B" letter-spacing="0.22em">
      PREREQUISITE GAP ENGINE
    </text>

    <!-- Micro Metadata Row -->
    <g transform="translate(2, 106)">
      <text x="0" y="0" font-family="'Geist Mono', monospace" font-size="11" fill="#475569" letter-spacing="0.08em">
        JEE <tspan fill="#334155">•</tspan> NEET <tspan fill="#334155">•</tspan> BOARDS <tspan fill="#334155">•</tspan> CUET
      </text>
      <circle cx="270" cy="-3" r="2" fill="#22C55E" />
      <text x="280" y="0" font-family="'Geist Mono', monospace" font-size="10.5" fill="#22C55E" letter-spacing="0.05em">
        ALGORITHMIC DAG ACTIVE
      </text>
    </g>
  </g>

  <!-- Right Decorative Hairline Tech Compass -->
  <g transform="translate(735, 120)" opacity="0.3">
    <circle cx="0" cy="0" r="24" stroke="#475569" stroke-width="1" stroke-dasharray="2 4" fill="none" />
    <circle cx="0" cy="0" r="14" stroke="#64748B" stroke-width="1" fill="none" />
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#475569" stroke-width="1" />
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#475569" stroke-width="1" />
  </g>
</svg>
